# Alembic, cho nguoi phat trien chay tay:
#   cd backend && alembic revision --autogenerate -m "them group_id"
#   cd backend && alembic upgrade head
#
# ⛔ URL KHONG DAT O DAY. Khi chay, `env.py` lay settings.DATABASE_URL - mot ban
# cai co the tro vao SQLite local, mot ban khac vao Postgres dung chung, va ung
# dung tu goi alembic trong init_db(). Mot URL ghi cung trong file nay se dung
# cho dung mot may va sai cho moi may con lai.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
