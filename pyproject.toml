[project]
name = "tiktok-automation-system"
version = "0.1.0"
description = "High-performance TikTok Automation System using Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.16",
    "websockets>=12.0",
    # ⛔ BAN CHINH CHU TU PyPI, khong con fork. Ba module cua rieng du an
    # (native_upload, media_integrity, firefox_extensions) da ve
    # backend/app/, va ban va close() duoc ap tu ngoai qua
    # juggler_close_patch. Fork truoc day gay mot xung dot merge moi lan
    # upstream ra ban moi, va 0.30.0 xoa han file chua ban va do.
    "invisible-playwright==0.30.0",
    "python-multipart>=0.0.32",
    "httpx[socks]>=0.28.1",
    "pillow>=12.3.0",
    "pywin32>=312",
    "apscheduler>=3.11.3",
    "cryptography>=50.0.1",
    "psycopg[binary]>=3.2",
    # ⛔ THEO CODE DI DOI MA SANG, va suyt bi bo lai. native_upload.py
    # import pywinauto LUOI - `from pywinauto.controls.win32_controls import
    # Edit` nam ben trong mot ham, dong 579 - nen mot lan grep import o dau
    # file khong thay no. Fork truoc day khai dependency nay; bo fork la
    # `uv lock` go luon pywinauto va comtypes.
    #
    # No nam trong try/except nen thieu thi khong vo ngay: duong fallback
    # cho o "File name" cua hop thoai Windows am tham khong chay, va chi
    # hien ra trong diagnostics. Dung loai hong de phat hien bang mat.
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    # Migration co thu tu, biet dialect. Truoc day schema duoc di cu bang
    # `PRAGMA table_info` + ALTER TABLE tu viet trong connection.py: chi chay
    # duoc tren SQLite, va khong co khai niem "phien ban schema" nen khong
    # the di cu nguoc hay chay co thu tu. Alembic la dieu kien truoc cua
    # Postgres, khong phai mot lua chon rieng.
    "alembic>=1.13",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    # ⛔ 4.2.2, NOT 4.2. Measured 04/10/2026 packaging the friends build on
    # Python 3.14: the compiled binary died on import with "TypeError:
    # exceptions must derive from BaseException", raised inside fastapi's
    # own `__annotate__` at `email: EmailStr | None` - 3.14 computes
    # annotations lazily (PEP 649) and 4.2 compiles that function wrongly.
    # The same code is fine uncompiled, so nothing downstream can see it:
    # it only appears in a release artifact. Reproduced in a two-minute
    # standalone build that imports nothing but fastapi, and cured by the
    # bump alone.
    "nuitka>=4.2.2",
]
